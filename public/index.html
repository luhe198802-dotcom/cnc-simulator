<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNC数控铣床仿真器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0A0A0F;color:#EAEAEA;padding:16px;max-width:700px;margin:0 auto}
.header{background:#12121A;border:1px solid rgba(0,240,255,0.15);border-radius:8px;padding:20px;margin-bottom:12px}
.header-label{color:#555570;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.header-title{color:#EAEAEA;font-size:20px;font-weight:700;margin-top:4px}
.header-line{height:2px;background:#00F0FF;border-radius:1px;margin-top:12px;width:40px}
.tool-info{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;background:#12121A;border-radius:6px;padding:10px;border:1px solid rgba(0,240,255,0.15)}
.tool-item{display:flex;align-items:center;gap:4px;font-size:11px}
.tool-item .dot{width:8px;height:8px;border-radius:50%}
.section{margin-top:14px}
.section-title{color:#555570;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.code-box{background:#12121A;border:1px solid rgba(0,240,255,0.15);border-radius:8px}
.code-box textarea{width:100%;min-height:140px;background:transparent;color:#EAEAEA;border:none;padding:12px;font-family:monospace;font-size:12px;resize:vertical}
.code-box textarea::placeholder{color:#555570}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.btn-primary{flex:1;background:#00F0FF;color:#0A0A0F}
.btn-secondary{background:transparent;border:1px solid #00F0FF;color:#00F0FF}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.error{background:rgba(255,0,60,0.1);border:1px solid rgba(255,0,60,0.3);border-radius:8px;padding:12px;margin-top:10px;color:#FF003C;font-size:12px;display:none}
.result{margin-top:16px;display:none}
.stats{display:flex;justify-content:space-around;background:#12121A;border:1px solid rgba(0,240,255,0.15);border-radius:8px;padding:12px}
.stat{text-align:center}
.stat-value{color:#00F0FF;font-size:18px;font-weight:700;font-family:monospace}
.stat-label{color:#555570;font-size:10px;margin-top:2px}
.canvas-wrap{display:flex;flex-direction:column;align-items:center;margin-top:14px}
canvas{background:#12121A;border-radius:10px}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px;width:100%}
.progress-bar{flex:1;height:4px;background:#12121A;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#00F0FF;border-radius:2px;width:0%}
.progress-text{color:#555570;font-size:10px;font-family:monospace;min-width:60px}
</style>
</head>
<body>
<div class="header">
<div class="header-label">CNC SIMULATOR</div>
<div class="header-title">数控铣床仿真器</div>
<div class="header-line"></div>
</div>
<div class="tool-info">
<div class="tool-item"><span class="dot" style="background:#FFB800"></span>工件 O32mm</div>
<div class="tool-item"><span class="dot" style="background:#00F0FF"></span>刀具 O5mm</div>
<div class="tool-item"><span class="dot" style="background:#00FF88"></span>转速 800RPM</div>
<div class="tool-item"><span class="dot" style="background:#FF003C"></span>下刀 30</div>
<div class="tool-item"><span class="dot" style="background:#00F0FF"></span>进给 80</div>
</div>
<div class="section">
<div class="section-title">G代码程序</div>
<div class="code-box">
<textarea id="gcode">G00 G90 G59
M03 S800
G00 X0 Y0 Z5
G01 Z-1 F30
G01 X-10 Y0 F80
G01 X10 Y0
G01 X0 Y0
G01 X0 Y-10
G01 X0 Y10
G00 Z50
M05
M30</textarea>
</div>
</div>
<div class="btns">
<button class="btn btn-primary" onclick="simulate()">解析程序</button>
<button class="btn btn-secondary" id="playBtn" style="display:none" onclick="togglePlay()">仿真</button>
</div>
<div class="error" id="error"></div>
<div class="result" id="result">
<div class="stats">
<div class="stat"><div class="stat-value" id="totalSeg">0</div><div class="stat-label">路径段</div></div>
<div class="stat"><div class="stat-value" id="totalPts">0</div><div class="stat-label">插值点</div></div>
</div>
<div class="canvas-wrap">
<canvas id="c" width="360" height="360"></canvas>
<div class="progress">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">0 / 0</div>
</div>
</div>
</div>
<script>
const ctx=document.getElementById("c").getContext("2d");
const cx=180,cy=180,workpieceR=160,toolR=25;
let data=null,points=[],idx=0,playing=false,timer=null;
drawEmpty();
function drawEmpty(){
ctx.fillStyle="#0A0A0F";ctx.fillRect(0,0,360,360);
ctx.strokeStyle="rgba(0,240,255,0.2)";ctx.lineWidth=1;
ctx.beginPath();ctx.arc(cx,cy,workpieceR,0,Math.PI*2);ctx.stroke();
ctx.fillStyle="#555";ctx.font="12px sans-serif";ctx.textAlign="center";
ctx.fillText("工件轮廓",cx,cy);
}
async function simulate(){
const gcode=document.getElementById("gcode").value;
if(!gcode.trim()){document.getElementById("error").textContent="请输入G代码";document.getElementById("error").style.display="block";return}
document.getElementById("error").style.display="none";
document.getElementById("playBtn").style.display="none";
document.getElementById("result").style.display="none";
stopAnim();
try{
const r=await fetch("/api/v1/simulate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gcode,scale:10})});
data=await r.json();
if(!data.success){document.getElementById("error").textContent=data.error;document.getElementById("error").style.display="block";return}
points=data.points;idx=0;drawPath();
document.getElementById("totalSeg").textContent=data.totalSegments;
document.getElementById("totalPts").textContent=data.totalPoints;
document.getElementById("progressText").textContent="0 / "+data.totalPoints;
document.getElementById("result").style.display="block";
document.getElementById("playBtn").style.display="block";
}catch(e){document.getElementById("error").textContent="网络错误: "+e.message;document.getElementById("error").style.display="block"}
}
function drawPath(){
if(!data)return;
ctx.fillStyle="#0A0A0F";ctx.fillRect(0,0,360,360);
ctx.strokeStyle="rgba(0,240,255,0.2)";ctx.lineWidth=1;
ctx.beginPath();ctx.arc(cx,cy,workpieceR,0,Math.PI*2);ctx.stroke();
if(data.pathSegments){
for(const s of data.pathSegments){
ctx.strokeStyle=s.type==="rapid"?"#555":"#0f0";
ctx.lineWidth=s.type==="rapid"?1:toolR*2;
ctx.beginPath();ctx.moveTo(cx+s.start.x,cy-s.start.y);
ctx.lineTo(cx+s.end.x,cy-s.end.y);ctx.stroke();
}
}
if(idx>0&&points){
ctx.fillStyle="rgba(0,240,255,0.15)";
ctx.beginPath();ctx.arc(cx+points[idx].x,cy-points[idx].y,toolR,0,Math.PI*2);ctx.fill();
ctx.strokeStyle="#00F0FF";ctx.lineWidth=1.5;
ctx.beginPath();ctx.arc(cx+points[idx].x,cy-points[idx].y,toolR,0,Math.PI*2);ctx.stroke();
}
}
function togglePlay(){if(playing)stopAnim();else startAnim()}
function startAnim(){
if(!points||points.length===0)return;
playing=true;document.getElementById("playBtn").textContent="暂停";idx=0;
timer=setInterval(()=>{
if(idx>=points.length-1){stopAnim();return}
idx++;drawPath();
document.getElementById("progressFill").style.width=(idx/points.length*100)+"%";
document.getElementById("progressText").textContent=idx+" / "+points.length;
},80);
}
function stopAnim(){playing=false;document.getElementById("playBtn").textContent="仿真";if(timer){clearInterval(timer);timer=null}}
</script>
</body>
</html>
