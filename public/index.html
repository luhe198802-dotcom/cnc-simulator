<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>加工中心仿真系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0A0A0F;color:#EAEAEA;padding:16px;max-width:700px;margin:0 auto}
.header{background:#12121A;border:1px solid rgba(0,240,255,0.15);border-radius:8px;padding:20px;margin-bottom:12px}
.header-label{color:#555570;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.header-title{color:#EAEAEA;font-size:20px;font-weight:700;margin-top:4px}
.header-line{height:2px;background:#00F0FF;border-radius:1px;margin-top:12px;width:40px}
.tool-info{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;background:#12121A;border-radius:6px;padding:12px;border:1px solid rgba(0,240,255,0.15)}
.tool-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500}
.tool-input{width:58px;background:#0A0A0F;border:1px solid rgba(0,240,255,0.28);border-radius:5px;color:#EAEAEA;padding:5px 6px;font:600 11px Menlo,Monaco,monospace}
.tool-input:focus{outline:none;border-color:#00F0FF}
.tool-input::-webkit-outer-spin-button,.tool-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dot{width:8px;height:8px;border-radius:50%}
.section{margin-top:14px}
.section-title{color:#555570;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.code-box{background:#12121A;border:1px solid rgba(0,240,255,0.15);border-radius:8px;overflow:hidden}
.code-box textarea{width:100%;min-height:140px;background:transparent;color:#EAEAEA;border:none;padding:12px;font-family:Menlo,Monaco,monospace;font-size:12px;line-height:1.5;resize:vertical}
.code-box textarea:focus{outline:none}
.code-box textarea::placeholder{color:#555570}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.btn-primary{flex:1;background:#00F0FF;color:#0A0A0F}
.btn-secondary{background:transparent;border:1px solid #00F0FF;color:#00F0FF}
.btn-danger{background:transparent;border:1px solid #FF003C;color:#FF003C}
.btn-example{background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);color:#00F0FF}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.error{display:none;align-items:center;gap:8px;background:rgba(255,0,60,0.1);border:1px solid rgba(255,0,60,0.3);border-radius:8px;padding:12px;margin-top:10px;color:#FF003C;font-size:12px;white-space:pre-line}
.result{margin-top:16px;display:none;background:linear-gradient(180deg,#11121A,#0B0C12);border:1px solid rgba(0,240,255,0.18);border-radius:8px;padding:14px;box-shadow:0 18px 48px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.04)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:transparent;border:none;border-radius:0;padding:0}
.stat{text-align:center;background:rgba(255,255,255,0.035);border:1px solid rgba(0,240,255,0.12);border-radius:6px;padding:12px 8px}
.stat-value{color:#00F0FF;font-size:22px;font-weight:700;font-family:Menlo,Monaco,monospace;text-shadow:0 0 18px rgba(0,240,255,0.25)}
.stat-label{color:#777890;font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.legend{display:flex;justify-content:center;gap:24px;margin-top:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.05)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10px;color:#8A8CA3}
.legend-line{width:20px;border-radius:2px}
.canvas-wrap{display:flex;flex-direction:column;align-items:center;margin-top:14px;background:#080910;border:1px solid rgba(0,240,255,0.14);border-radius:8px;padding:12px;box-shadow:inset 0 0 30px rgba(0,0,0,0.38)}
canvas{width:min(100%,420px);height:auto;background:#12121A;border:1px solid rgba(0,240,255,0.16);border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,0.34)}
.pos-display{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:transparent;border:none;border-radius:0;padding:0;margin-top:12px;width:100%}
.pos-item{text-align:center}
.pos-label{color:#6E7086;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.pos-value{color:#00F0FF;font-size:16px;font-weight:700;font-family:Menlo,Monaco,monospace;margin-top:4px;background:#10111A;border:1px solid rgba(0,240,255,0.12);border-radius:6px;padding:8px 4px}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px;width:100%}
.progress-bar{flex:1;height:6px;background:#1E1E28;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF9F1C,#FFB800);border-radius:999px;transition:width 0.2s;box-shadow:0 0 16px rgba(255,159,28,0.35)}
.progress-text{color:#777890;font-size:10px;font-family:Menlo,Monaco,monospace;min-width:60px;text-align:right}
.hint{color:#777890;font-size:10px;text-align:center;margin-top:10px}
@media (max-width:420px){.result{padding:10px}.stat-value{font-size:18px}.legend{gap:14px}.canvas-wrap{padding:8px}}
</style>
</head>
<body>
<div class="header">
<div class="header-label">MACHINING CENTER</div>
<div class="header-title">加工中心仿真系统</div>
<div class="header-line"></div>
</div>
<div class="tool-info">
<div class="tool-item"><span class="dot" style="background:#FFB800"></span>工件 O<input class="tool-input" id="workpieceDiameter" type="text" inputmode="decimal" value="32">mm</div>
<div class="tool-item"><span class="dot" style="background:#00F0FF"></span>刀具 O5mm</div>
<div class="tool-item"><span class="dot" style="background:#00FF88"></span>转速 800RPM</div>
<div class="tool-item"><span class="dot" style="background:#FF003C"></span>下刀 30</div>
<div class="tool-item"><span class="dot" style="background:#00F0FF"></span>进给 80</div>
</div>
<div class="section">
<div class="section-title">G代码程序</div>
<div class="code-box">
<textarea id="gcode" placeholder="输入G代码程序..."></textarea>
</div>
</div>
<div class="btns">
<button class="btn btn-example" onclick="loadExample()">✦ 十字图案</button>
<button class="btn btn-primary" onclick="simulate()">▶ 解析程序</button>
<button class="btn btn-secondary" id="playBtn" style="display:none" onclick="togglePlay()">▶ 仿真</button>
<button class="btn btn-danger" id="resetBtn" style="display:none" onclick="reset()">✕ 重置</button>
</div>
<div class="error" id="error"></div>
<div class="result" id="result">
<div class="stats">
<div class="stat"><div class="stat-value" id="totalSeg">0</div><div class="stat-label">路径段</div></div>
<div class="stat"><div class="stat-value" id="cutSeg">0</div><div class="stat-label">切削段</div></div>
<div class="stat"><div class="stat-value" id="totalPts">0</div><div class="stat-label">插值点</div></div>
</div>
<div class="legend">
<div class="legend-item"><div class="legend-line" style="background:#FF9F1C;height:6px"></div>切削区域</div>
<div class="legend-item"><div class="legend-line" style="background:#555570;height:1px"></div>快速移动</div>
</div>
<div class="canvas-wrap">
<canvas id="c" width="360" height="360"></canvas>
<div class="pos-display">
<div class="pos-item"><div class="pos-label">X</div><div class="pos-value" id="posX">0.00</div></div>
<div class="pos-item"><div class="pos-label">Y</div><div class="pos-value" id="posY">0.00</div></div>
<div class="pos-item"><div class="pos-label">Z</div><div class="pos-value" id="posZ">50.00</div></div>
</div>
<div class="progress">
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-text" id="progressText">0 / 0</div>
</div>
</div>
<div class="hint">橙色区域 = 刀具切削范围 (O5mm)</div>
</div>
<script>
const ctx=document.getElementById("c").getContext("2d");
const cx=180,cy=180,toolRadiusMm=2.5,maxCanvasRadius=150;
let displayScale=8,workpieceR=16*displayScale,toolR=toolRadiusMm*displayScale;
let data=null,points=[],idx=0,playing=false,timer=null;

const EXAMPLE_CODE=`G00 G90 G59
M03 S800
G00 X0 Y0 Z5
G01 Z-1 F30
G01 X-10 Y0 F80
G01 X10 Y0
G01 X0 Y0
G01 X0 Y-10
G01 X0 Y10
G00 Z50
M05
M30`;

drawEmpty();

function loadExample(){
  document.getElementById("gcode").value=EXAMPLE_CODE;
}

function getWorkpieceDiameter(){
  const diameter=Number(document.getElementById("workpieceDiameter").value);
  return Number.isFinite(diameter)&&diameter>0?diameter:32;
}

function syncWorkpieceGeometry(){
  const diameter=getWorkpieceDiameter();
  const workpieceRadiusMm=diameter/2;
  displayScale=Math.min(8,maxCanvasRadius/(workpieceRadiusMm+toolRadiusMm));
  workpieceR=workpieceRadiusMm*displayScale;
  toolR=toolRadiusMm*displayScale;
  return diameter;
}

function drawStage(){
  const bg=ctx.createLinearGradient(0,0,360,360);
  bg.addColorStop(0,"#181A25");
  bg.addColorStop(1,"#07080D");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,360,360);

  ctx.fillStyle="rgba(0,0,0,0.38)";
  ctx.beginPath();
  ctx.arc(cx+4,cy+6,workpieceR+5,0,Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,workpieceR,0,Math.PI*2);
  ctx.clip();
  const metal=ctx.createRadialGradient(cx,cy,8,cx,cy,workpieceR);
  metal.addColorStop(0,"#AEB5BA");
  metal.addColorStop(0.38,"#8E979D");
  metal.addColorStop(0.72,"#687178");
  metal.addColorStop(1,"#424A50");
  ctx.fillStyle=metal;
  ctx.fillRect(cx-workpieceR,cy-workpieceR,workpieceR*2,workpieceR*2);

  ctx.strokeStyle="rgba(255,255,255,0.12)";
  ctx.lineWidth=0.7;
  for(let r=22;r<workpieceR;r+=10){
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.strokeStyle="rgba(22,28,34,0.16)";
  ctx.lineWidth=1;
  for(let i=-15;i<=15;i+=5){
    ctx.beginPath();
    ctx.moveTo(cx+i*displayScale,cy-workpieceR);
    ctx.lineTo(cx+i*displayScale,cy+workpieceR);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-workpieceR,cy-i*displayScale);
    ctx.lineTo(cx+workpieceR,cy-i*displayScale);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle="rgba(210,218,224,0.42)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(cx,cy,workpieceR,0,Math.PI*2);
  ctx.stroke();
  ctx.strokeStyle="rgba(32,38,44,0.85)";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(cx,cy,workpieceR-3,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeStyle="rgba(0,40,50,0.3)";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx-workpieceR,cy);
  ctx.lineTo(cx+workpieceR,cy);
  ctx.moveTo(cx,cy-workpieceR);
  ctx.lineTo(cx,cy+workpieceR);
  ctx.stroke();

  ctx.fillStyle="rgba(0,240,255,0.8)";
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fill();
  ctx.font="10px Menlo,Monaco,monospace";
  ctx.textAlign="center";
  ctx.fillStyle="rgba(234,234,234,0.58)";
  ctx.fillText("X",cx+workpieceR-12,cy-8);
  ctx.fillText("Y",cx+12,cy-workpieceR+16);
  const diameterLabel=getWorkpieceDiameter();
  ctx.fillText("O"+(Number.isInteger(diameterLabel)?diameterLabel:diameterLabel.toFixed(1)),cx,cy+workpieceR-12);
}

function drawEmpty(){
  syncWorkpieceGeometry();
  drawStage();
  return;
  ctx.fillStyle="#0A0A0F";
  ctx.fillRect(0,0,360,360);
  ctx.strokeStyle="rgba(0,240,255,0.2)";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(cx,cy,workpieceR,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle="#555";
  ctx.font="12px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("工件轮廓",cx,cy);
}

async function simulate(){
  const gcode=document.getElementById("gcode").value;
  const workpieceDiameter=Number(document.getElementById("workpieceDiameter").value);
  if(!Number.isFinite(workpieceDiameter)||workpieceDiameter<=0){
    document.getElementById("error").textContent="请输入有效的工件直径";
    document.getElementById("error").style.display="flex";
    return;
  }
  if(!gcode.trim()){
    document.getElementById("error").textContent="请输入G代码";
    document.getElementById("error").style.display="flex";
    return;
  }
  syncWorkpieceGeometry();
  hideErr();
  document.getElementById("playBtn").style.display="none";
  document.getElementById("resetBtn").style.display="none";
  document.getElementById("result").style.display="none";
  stopAnim();
  
  try{
    const r=await fetch("/api/v1/simulate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gcode,scale:displayScale,workpieceDiameter})});
    data=await r.json();
    if(!data.success){
      document.getElementById("error").textContent=data.error;
      document.getElementById("error").style.display="flex";
      return;
    }
    points=data.points;
    idx=0;
    drawPath();
    
    const cuttingSegs=data.pathSegments.filter(s=>s.type!=="rapid"&&s.start.z<0&&s.end.z<0).length;
    document.getElementById("totalSeg").textContent=data.totalSegments;
    document.getElementById("cutSeg").textContent=cuttingSegs;
    document.getElementById("totalPts").textContent=data.totalPoints;
    document.getElementById("progressText").textContent="0 / "+data.totalPoints;
    document.getElementById("result").style.display="block";
    document.getElementById("playBtn").style.display="block";
    document.getElementById("resetBtn").style.display="block";
    updatePos(0,0,50);
  }catch(e){
    document.getElementById("error").textContent="网络错误: "+e.message;
    document.getElementById("error").style.display="flex";
  }
}

function updatePos(x,y,z){
  document.getElementById("posX").textContent=(x/displayScale).toFixed(2);
  document.getElementById("posY").textContent=(y/displayScale).toFixed(2);
  document.getElementById("posZ").textContent=z.toFixed(2);
}

function drawCapsule(x1,y1,x2,y2,r){
  const dx=x2-x1,dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy);
  if(len<0.1){
    ctx.beginPath();
    ctx.arc(x1,y1,r,0,Math.PI*2);
    ctx.fill();
    return;
  }
  const angle=Math.atan2(dy,dx);
  ctx.save();
  ctx.translate(x1,y1);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.arc(0,0,r,Math.PI/2,-Math.PI/2);
  ctx.lineTo(len,0-r);
  ctx.arc(len,0,r,-Math.PI/2,Math.PI/2);
  ctx.lineTo(0,r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPath(){
  if(!data)return;
  drawStage();
  
  if(data.pathSegments){
    for(const s of data.pathSegments){
      const isCut=s.type!=="rapid"&&s.start.z<0&&s.end.z<0;
      if(isCut){
        ctx.shadowColor="rgba(255,159,28,0.32)";
        ctx.shadowBlur=12;
        ctx.fillStyle="rgba(255,159,28,0.68)";
        drawCapsule(cx+s.start.x,cy-s.start.y,cx+s.end.x,cy-s.end.y,toolR);
        ctx.shadowBlur=0;
      }else{
        ctx.setLineDash([5,5]);
        ctx.strokeStyle="rgba(151,154,180,0.5)";
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx+s.start.x,cy-s.start.y);
        ctx.lineTo(cx+s.end.x,cy-s.end.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  
  if(idx>0&&points&&points[idx]){
    const p=points[idx];
    ctx.shadowColor="rgba(0,240,255,0.35)";
    ctx.shadowBlur=18;
    ctx.fillStyle="rgba(0,240,255,0.15)";
    ctx.beginPath();
    ctx.arc(cx+p.x,cy-p.y,toolR,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#00F0FF";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(cx+p.x,cy-p.y,toolR,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle="#00F0FF";
    ctx.beginPath();
    ctx.arc(cx+p.x,cy-p.y,3,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    updatePos(p.x,p.y,p.z);
  }
}

function togglePlay(){
  if(playing)stopAnim();
  else startAnim();
}

function startAnim(){
  if(!points||points.length===0)return;
  playing=true;
  document.getElementById("playBtn").textContent="⏸ 暂停";
  idx=0;
  timer=setInterval(()=>{
    if(idx>=points.length-1){
      stopAnim();
      return;
    }
    idx++;
    drawPath();
    document.getElementById("progressFill").style.width=(idx/points.length*100)+"%";
    document.getElementById("progressText").textContent=idx+" / "+points.length;
  },240);
}

function stopAnim(){
  playing=false;
  document.getElementById("playBtn").textContent="▶ 仿真";
  if(timer){
    clearInterval(timer);
    timer=null;
  }
}

function reset(){
  data=null;
  points=[];
  idx=0;
  stopAnim();
  drawEmpty();
  document.getElementById("gcode").value="";
  document.getElementById("result").style.display="none";
  document.getElementById("playBtn").style.display="none";
  document.getElementById("resetBtn").style.display="none";
  document.getElementById("progressFill").style.width="0%";
  updatePos(0,0,50);
}

function hideErr(){
  document.getElementById("error").style.display="none";
}

document.getElementById("workpieceDiameter").addEventListener("input",()=>{
  data=null;
  points=[];
  idx=0;
  stopAnim();
  drawEmpty();
  document.getElementById("result").style.display="none";
  document.getElementById("playBtn").style.display="none";
  document.getElementById("resetBtn").style.display="none";
  document.getElementById("progressFill").style.width="0%";
  updatePos(0,0,50);
});
</script>
</body>
</html>
